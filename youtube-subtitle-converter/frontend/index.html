<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자막 변환기 — 유튜브 목소리를 글로</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
  <header class="app-header">
    <h1>자막 변환기</h1>
    <p class="tagline">유튜브 영상의 목소리를 한글 자막으로 — 듣는 대신, 읽으세요.</p>
  </header>

  <!-- 항목 3: URL 입력창 + 타임스탬프 토글 + 변환 버튼 -->
  <section class="convert-card" aria-label="자막 변환 입력">
    <label for="url-input" class="visually-hidden">유튜브 영상 URL</label>
    <input id="url-input" type="url" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="유튜브 영상 주소를 붙여넣으세요 (예: https://youtu.be/...)"
           aria-describedby="url-help">
    <p id="url-help" class="help-text">링크를 넣고 버튼을 누르면 영상 속 목소리가 글이 됩니다.</p>

    <div class="options-row">
      <label class="toggle" for="ts-toggle">
        <input type="checkbox" id="ts-toggle" checked role="switch" aria-checked="true">
        <span class="track" aria-hidden="true"></span>
        <span class="toggle-label">타임스탬프 포함 <small>[01:23] 형태의 시간 정보</small></span>
      </label>
      <button id="convert-btn" type="button" class="btn-primary">자막 변환하기</button>
    </div>
    <p id="error-box" class="error" role="alert" hidden></p>
  </section>

  <!-- 항목 8: 로딩 오버레이 -->
  <div id="loading" class="loading-overlay" role="status" aria-live="polite" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p>대학생과 직장인의 소중한 시간을 절약하기 위해<br>목소리를 자막으로 변환하고 있어요</p>
    <p class="loading-sub">영상 길이에 따라 수 분 걸릴 수 있어요</p>
  </div>

  <!-- 항목 6: 미리보기 + 항목 9: 검색 + 항목 7: 저장 -->
  <section id="result" class="result-card" aria-label="변환 결과" hidden>
    <h2 id="video-title" class="video-title"></h2>

    <div class="search-row">
      <label for="search-input" class="visually-hidden">자막 내 검색</label>
      <input id="search-input" type="search" placeholder="자막에서 단어 검색 (예: 시험, 회의)"
             aria-controls="preview">
      <span id="search-count" class="search-count" aria-live="polite"></span>
      <div class="font-controls" role="group" aria-label="글자 크기 조절">
        <button id="font-minus" type="button" aria-label="글자 작게">가−</button>
        <button id="font-plus" type="button" aria-label="글자 크게">가+</button>
      </div>
    </div>

    <div id="preview" class="preview" tabindex="0" aria-label="변환된 자막 미리보기"></div>

    <button id="download-btn" type="button" class="btn-primary btn-download">TXT 파일로 저장하기</button>
  </section>

  <footer class="app-footer">
    <p>귀 대신 눈으로 — 모든 학생을 위한 시각 자막 서비스</p>
  </footer>
</main>
<script src="js/app.js"></script>
</body>
</html>
